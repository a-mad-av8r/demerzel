# The repository pins every action by SHA, so upstream patches do not arrive automatically; Dependabot opens PRs for them.
# Update the SHA and the following version comment together, keeping dependencies auditable and updatable.
#
# Do not declare target-branch. Dependabot defaults to the default branch (currently main); declaring target-branch prevents this file's ecosystem configuration from applying to security updates, so groups, labels, and commit-message have no effect on security-update PRs.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
    groups:
      # Keep this consistent with the two groups below: major upgrades get their own PRs so breaking changes can be assessed.
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      # Major upgrades get their own PRs so breaking changes can be assessed.
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # third_party/cpaembedded is an independent module that Dependabot does not discover recursively from the repository root, so it must be declared explicitly. It is compiled into the main binary through replace, making its dependencies part of the real attack surface.
  - package-ecosystem: gomod
    directory: /third_party/cpaembedded
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      cpaembedded-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(web)
    labels:
      - dependencies
      - javascript
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
