name: Release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read

# The pipe separator falls back to the next source on any error, including a network error. The default comma separator falls back only on 404/410, so a transient proxy.golang.org failure would fail the entire job.
# Deterministic CI and release verification retain the local Go cache on the self-hosted runner. Release artefacts, publication, and external-service jobs use ephemeral GitHub-hosted runners. Neither workflow downloads or uploads setup-go caches, and no push to main is needed to warm them.
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # actions: read is required to read the CI conclusion for the same commit.
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      image_exact: ${{ steps.tag.outputs.image_exact }}
      image_beta: ${{ steps.tag.outputs.image_beta }}
      image_major: ${{ steps.tag.outputs.image_major }}
      release_kind: ${{ steps.tag.outputs.release_kind }}
      channel_beta: ${{ steps.tag.outputs.channel_beta }}
      promote_major: ${{ steps.tag.outputs.promote_major }}
      ci_verified: ${{ steps.ci.outputs.ci_verified }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate strict 2.x SemVer tag
        id: tag
        shell: bash
        run: |
          # release-tag-validation:start
          tag="${GITHUB_REF_NAME}"
          semver_regex='^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${tag}" =~ ${semver_regex} ]]; then
            printf 'invalid 2.x release tag\n' >&2
            exit 1
          fi

          version="${tag#v}"
          core="${version%%-*}"
          prerelease=false
          release_kind=stable
          channel_beta=false
          promote_major=true
          if [[ "${version}" == *-* ]]; then
            prerelease=true
            prerelease_value="${version#*-}"
            release_kind=other
            promote_major=false
            IFS='.' read -r -a identifiers <<<"${prerelease_value}"
            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ ]] &&
                [[ "${identifier}" != "0" ]] &&
                [[ "${identifier}" == 0* ]]; then
                printf 'numeric prerelease identifiers cannot contain leading zeroes\n' >&2
                exit 1
              fi
            done
          fi

          channel_beta_regex='^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$'
          if [[ "${tag}" =~ ${channel_beta_regex} ]]; then
            channel_beta=true
            release_kind=beta
          elif [[ "${tag}" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
            release_kind=rc
          fi

          IFS='.' read -r major minor _ <<<"${core}"
          image_beta=
          if [[ "${channel_beta}" == "true" ]]; then
            image_beta="${major}.${minor}-beta"
          fi
          if [[ "${core}" == "2.0.0" ]] &&
            [[ "${release_kind}" == "beta" || "${release_kind}" == "rc" ]]; then
            promote_major=true
          fi
          {
            printf 'version=%s\n' "${tag}"
            printf 'prerelease=%s\n' "${prerelease}"
            printf 'image_exact=%s\n' "${version}"
            printf 'image_beta=%s\n' "${image_beta}"
            printf 'image_major=%s\n' "${major}"
            printf 'release_kind=%s\n' "${release_kind}"
            printf 'channel_beta=%s\n' "${channel_beta}"
            printf 'promote_major=%s\n' "${promote_major}"
          } >>"${GITHUB_OUTPUT}"
          # release-tag-validation:end

      - name: Require tag commit in main history
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Reuse CI verdict for this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Race tests, CPA bridge tests, and database contracts are deterministic verification for the same commit. Re-running after ci.yml has already succeeded cannot produce a different conclusion; it only adds about eight minutes to the critical path.
          # A missing successful run, a failed query, or any conclusion other than success always falls back to a full rerun.
          # release-ci-verdict-reuse:start
          runs=query-failed
          ci_verified=false
          if runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[
                .workflow_runs[]
                | select(.status == "completed" and .conclusion == "success")
              ] | length'
          )" && [[ "${runs}" =~ ^[0-9]+$ ]] && ((runs > 0)); then
            ci_verified=true
          fi
          # release-ci-verdict-reuse:end
          printf 'ci_verified=%s\n' "${ci_verified}" >>"${GITHUB_OUTPUT}"
          printf 'successful ci.yml runs for %s: %s -> ci_verified=%s\n' \
            "${GITHUB_SHA}" "${runs}" "${ci_verified}"

  verify-and-build-web:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build web UI
        uses: ./.github/actions/web-ci

      - name: Upload verified web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-web-dist
          path: internal/webui/dist
          if-no-files-found: error
          # Passed to build-binaries only for this run; it is not retained as a release artefact.
          retention-days: 1

  static-checks:
    needs: validate-tag
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        run: |
          # go-format-check:start
          formatted_files="$(gofmt -l .)"
          test -z "${formatted_files}"
          # go-format-check:end

      - name: Check module graph
        run: go mod tidy -diff

      - name: Check embedded CPA bridge module
        working-directory: third_party/cpaembedded
        run: |
          go mod tidy -diff
          go vet ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -trimpath -o gpt-load .

      - name: Check repository invariants
        run: git diff --check

  race-tests:
    needs: validate-tag
    # Skip when CI for the same commit is fully green; publication-preflight accepts a skipped result.
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run race-enabled tests
        run: go test -race -vet=off -count=1 -timeout=15m . ./internal/...

  race-cpa:
    needs: validate-tag
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run embedded CPA bridge race-enabled tests
        working-directory: third_party/cpaembedded
        run: go test -race -count=1 -timeout=15m ./...

  database-contract:
    name: Database contract (${{ matrix.driver }})
    needs: validate-tag
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            data-dir: /var/lib/mysql
            port: "3306"
            health: mysqladmin ping -h 127.0.0.1 -proot
            dsn: mysql://root:root@127.0.0.1:{0}/gpt_load?charset=utf8mb4&transaction_isolation=%27READ-COMMITTED%27
          - driver: postgres
            image: postgres:18
            data-dir: /var/lib/postgresql
            port: "5432"
            health: pg_isready -U postgres -d gpt_load
            dsn: postgres://postgres:postgres@127.0.0.1:{0}/gpt_load?sslmode=disable
    # Only the temporary contract-test database uses tmpfs; each instance consumes what it needs, up to 2 GiB.
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gpt_load
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpt_load
        ports:
          - ${{ matrix.port }}
        options: >-
          --tmpfs ${{ matrix.data-dir }}:rw,nosuid,nodev,size=2g
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20
      # The two MySQL shards use separate instances so their test databases do not contend for a same-named GET_LOCK.
      secondary-mysql:
        image: ${{ matrix.driver == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gpt_load
        ports:
          - 3306
        options: >-
          --tmpfs /var/lib/mysql:rw,nosuid,nodev,size=2g
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run external database contract
        env:
          GPT_LOAD_DATABASE_TEST_DSN: ${{ format(matrix.dsn, job.services.database.ports[format('{0}', matrix.port)]) }}
          GPT_LOAD_DATABASE_SECONDARY_DSN: ${{ matrix.driver == 'mysql' && format(matrix.dsn, job.services.secondary-mysql.ports['3306']) || '' }}
        run: .github/scripts/ci-database-contract.sh "${{ matrix.driver }}"

  build-binaries:
    needs: verify-and-build-web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        include:
          - goos: linux
            runner: ubuntu-24.04
            goarch: amd64
            filename: demerzel-linux-amd64
          - goos: linux
            runner: ubuntu-24.04
            goarch: arm64
            filename: demerzel-linux-arm64
          - goos: darwin
            runner: macos-15
            goarch: amd64
            filename: demerzel-macos-amd64
          - goos: darwin
            runner: macos-15
            goarch: arm64
            filename: demerzel-macos-arm64
          - goos: windows
            runner: windows-2025
            goarch: amd64
            filename: gpt-load-windows-amd64.exe
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-web-dist
          path: internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p release
          go build -trimpath \
            -ldflags "-s -w -X gpt-load/internal/platform/version.Version=${{ github.ref_name }}" \
            -o "release/${{ matrix.filename }}" .

      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error
          # native-artifact-smoke downloads this artefact on demand. Its retention period must match release-assets, otherwise a retry of a failed run after the shorter retention period cannot download the expired artefact.
          retention-days: 14

  build-windows-setup:
    needs: build-binaries
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-amd64.exe
          path: release

      - name: Build Windows setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler is unavailable: $compiler"
          }
          & $compiler `
            "/DAppVersion=$env:RELEASE_VERSION" `
            "packaging/windows/gpt-load.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "release/gpt-load-windows-setup.exe")) {
            throw "Windows setup was not generated"
          }

      - name: Upload Windows setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-gpt-load-windows-setup.exe
          path: release/gpt-load-windows-setup.exe
          if-no-files-found: error
          retention-days: 14

  package-metadata:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate release SBOM, license assets, and installer tools
        run: |
          mkdir -p release
          cp LICENSE release/LICENSE
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          cp LICENSES/Apache-2.0.txt release/Apache-2.0.txt
          cp LICENSES/BSD-2-Clause-dbus.txt release/BSD-2-Clause-dbus.txt
          cp LICENSES/BSD-3-Clause-age.txt release/BSD-3-Clause-age.txt
          cp LICENSES/Inno-Setup.txt release/Inno-Setup.txt
          cp LICENSES/MIT.txt release/MIT.txt
          cp LICENSES/MPL-2.0.txt release/MPL-2.0.txt
          cp packaging/install.sh release/install.sh
          cp packaging/verify-release.sh release/verify-release.sh
          cp packaging/local-smoke.sh release/local-smoke.sh
          cp packaging/homebrew/demerzel.rb release/demerzel.rb
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          from pathlib import Path
          import sys

          formula_path = Path("release/demerzel.rb")
          contents = formula_path.read_text(encoding="utf-8")
          source = '  version "2.0.0"\n'
          replacement = f'  version "{sys.argv[1]}"\n'
          if contents.count(source) != 1:
              raise SystemExit("Homebrew formula release-version anchor is missing or ambiguous")
          formula_path.write_text(contents.replace(source, replacement), encoding="utf-8")
          PY
          chmod 0755 release/install.sh release/verify-release.sh release/local-smoke.sh
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            mod -json -noserial -notimestamp -output release/bom.cdx.json .

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release
          if-no-files-found: error
          # Aggregated into release-assets only for this run; it is not retained separately.
          retention-days: 1

  package-checksums:
    needs:
      - build-binaries
      - build-windows-setup
      - package-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release
          merge-multiple: true

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Create and sign the Demerzel release manifest
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/release-create-manifest.sh \
            release "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
          cosign sign-blob --yes \
            --bundle release/manifest.sigstore.json \
            release/manifest.json

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          grep -vFx 'SHA256SUMS' .github/release-assets.txt >/tmp/checksum-targets
          cd release
          xargs -a /tmp/checksum-targets -d '\n' sha256sum >SHA256SUMS

      - name: Verify complete release asset set
        run: .github/scripts/release-verify-assets.sh release

      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14


  native-artifact-smoke:
    # package-checksums already depends on build-binaries, so no duplicate declaration is needed.
    needs: package-checksums
    timeout-minutes: 10
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        include:
          - runner: ubuntu-24.04
            filename: demerzel-linux-amd64
          - runner: ubuntu-24.04-arm
            filename: demerzel-linux-arm64
          - runner: macos-15-intel
            filename: demerzel-macos-amd64
          - runner: macos-15
            filename: demerzel-macos-arm64
          - runner: windows-2025
            filename: gpt-load-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.filename }}
          path: native-smoke

      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: native-smoke

      - name: Smoke POSIX native artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_BINARY: ${{ github.workspace }}/native-smoke/${{ matrix.filename }}
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}/native-smoke/SHA256SUMS
        run: .github/scripts/release-native-smoke.sh

      - name: Smoke Windows native artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_BINARY: ${{ github.workspace }}/native-smoke/${{ matrix.filename }}
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}/native-smoke/SHA256SUMS
        run: |
          & .github/scripts/release-native-smoke.ps1
          exit $LASTEXITCODE

  windows-installer-smoke:
    needs: package-checksums
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-setup.exe
          path: installer-smoke

      - name: Download portable Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-amd64.exe
          path: installer-smoke

      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: installer-smoke

      - name: Smoke Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_WINDOWS_SETUP: ${{ github.workspace }}\installer-smoke\gpt-load-windows-setup.exe
          RELEASE_WINDOWS_BINARY: ${{ github.workspace }}\installer-smoke\gpt-load-windows-amd64.exe
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}\installer-smoke\SHA256SUMS
        run: |
          & .github/scripts/release-windows-installer-smoke.ps1
          exit $LASTEXITCODE

  docker-smoke:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          # Use a temporary Docker login configuration to avoid overwriting the host's Docker credentials.
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke local image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SMOKE_TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: .github/scripts/release-docker-smoke.sh

  prebuilt-image-smoke:
    name: Prebuilt image smoke (${{ matrix.arch }})
    # publish-images pushes the prebuilt target, so this exact packaging path must be smoke-tested and vulnerability-scanned before publication. docker-smoke covers a separate self-contained source build; neither substitutes for the other, and removing either leaves a release path without pre-publication verification.
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          # publish-images pushes both linux/amd64 and linux/arm64. Their prebuilt paths COPY different binaries, so each must be verified. Use a native arm64 runner rather than QEMU, whose emulated startup cannot represent a real arm64 runtime.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          # Use a temporary Docker login configuration to avoid overwriting the host's Docker credentials.
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prebuilt Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-demerzel-linux-${{ matrix.arch }}
          path: release

      - name: Build and smoke prebuilt image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SUFFIX: prebuilt-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SMOKE_TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          RELEASE_SMOKE_BUILD_TARGET: prebuilt
        run: .github/scripts/release-docker-smoke.sh

  publication-preflight:
    needs:
      - validate-tag
      - verify-and-build-web
      - static-checks
      - race-tests
      - race-cpa
      - build-binaries
      - build-windows-setup
      - package-checksums
      - native-artifact-smoke
      - windows-installer-smoke
      - docker-smoke
      - prebuilt-image-smoke
      - database-contract
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    outputs:
      write_mode: ${{ steps.classify.outputs.write_mode }}
      github_state: ${{ steps.inventory.outputs.github_state }}
      github_target_sha: ${{ steps.inventory.outputs.github_target_sha }}
      github_assets: ${{ steps.inventory.outputs.github_assets }}
      ghcr_state: ${{ steps.inventory.outputs.ghcr_state }}
      ghcr_digest: ${{ steps.inventory.outputs.ghcr_digest }}
      ghcr_revision: ${{ steps.inventory.outputs.ghcr_revision }}
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >>"${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify current-run tag, ancestry, and assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          .github/scripts/release-verify-assets.sh release

      - name: Verify GitHub repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          gh auth status
          gh api "repos/${GITHUB_REPOSITORY}" --silent

      - name: Log in to owned GHCR package for read-only inventory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inventory GitHub draft and owned GHCR exact image
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
        shell: bash
        run: |
          set -euo pipefail

          github_state=absent
          github_target_sha=
          github_assets=absent
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json targetCommitish,isDraft,isPrerelease,assets \
            >/tmp/existing-release.json 2>/tmp/existing-release.error; then
            github_state=present
            github_target_sha="$(jq -r '.targetCommitish // empty' /tmp/existing-release.json)"
            test "$(jq -r '.isDraft' /tmp/existing-release.json)" = true
            test "$(jq -r '.isPrerelease' /tmp/existing-release.json)" = \
              "${{ needs.validate-tag.outputs.prerelease }}"
            jq -r '.assets[].name' /tmp/existing-release.json |
              LC_ALL=C sort >/tmp/existing-release-assets
            github_assets=mismatch
            if cmp .github/release-assets.txt /tmp/existing-release-assets; then
              mkdir existing-release
              gh release download "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --dir existing-release
              if .github/scripts/release-verify-assets.sh \
                existing-release release/SHA256SUMS; then
                github_assets=match
              fi
            fi
          elif ! grep -Eqi 'HTTP 404|Not Found|release not found' /tmp/existing-release.error; then
            cat /tmp/existing-release.error >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_EXACT}"
          ghcr_digest="$(.github/scripts/release-image-digest.sh "${image}")"
          ghcr_state=absent
          ghcr_revision=
          if [[ "${ghcr_digest}" != absent ]]; then
            ghcr_state=present
            status=0
            ghcr_revision="$(
              .github/scripts/release-verify-image-revision.sh \
                "${image}" "${GITHUB_SHA}"
            )" || status=$?
            if ((status == 1)); then
              ghcr_revision=mismatch
            elif ((status != 0)); then
              exit "${status}"
            fi
          fi
          {
            printf 'github_state=%s\n' "${github_state}"
            printf 'github_target_sha=%s\n' "${github_target_sha}"
            printf 'github_assets=%s\n' "${github_assets}"
            printf 'ghcr_state=%s\n' "${ghcr_state}"
            printf 'ghcr_digest=%s\n' "${ghcr_digest}"
            printf 'ghcr_revision=%s\n' "${ghcr_revision}"
          } >>"${GITHUB_OUTPUT}"

      - name: Classify owned publication state
        id: classify
        env:
          RELEASE_EXPECTED_SHA: ${{ github.sha }}
          RELEASE_GITHUB_STATE: ${{ steps.inventory.outputs.github_state }}
          RELEASE_GITHUB_TARGET_SHA: ${{ steps.inventory.outputs.github_target_sha }}
          RELEASE_GITHUB_ASSETS: ${{ steps.inventory.outputs.github_assets }}
          RELEASE_GHCR_STATE: ${{ steps.inventory.outputs.ghcr_state }}
          RELEASE_GHCR_DIGEST: ${{ steps.inventory.outputs.ghcr_digest }}
          RELEASE_GHCR_REVISION: ${{ steps.inventory.outputs.ghcr_revision }}
        run: |
          set -euo pipefail
          classification="$(.github/scripts/release-publication-state.sh)"
          printf '%s\n' "${classification}"
          while IFS='=' read -r key value; do
            case "${key}" in
              publication_state|write_mode) printf '%s=%s\n' "${key}" "${value}" >>"${GITHUB_OUTPUT}" ;;
              *) printf 'unexpected classifier output\n' >&2; exit 1 ;;
            esac
          done <<<"${classification}"

      - name: Reject conflicting publication state
        env:
          WRITE_MODE: ${{ steps.classify.outputs.write_mode }}
        run: test "${WRITE_MODE}" != blocked

  release-approval:
    needs: publication-preflight
    if: ${{ !cancelled() && needs.publication-preflight.result == 'success' && needs.publication-preflight.outputs.write_mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: demerzel-release
    permissions:
      contents: read
    steps:
      - name: Require tag-specific release authorization
        env:
          APPROVED_TAG: ${{ vars.DEMERZEL_RELEASE_APPROVED_TAG }}
        run: |
          set -euo pipefail
          if [[ "${APPROVED_TAG}" != "${GITHUB_REF_NAME}" ]]; then
            printf 'release approval variable must exactly match tag %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          printf 'Explicitly authorized publication for %s after protected-environment approval.\n' \
            "${GITHUB_REF_NAME}" >>"${GITHUB_STEP_SUMMARY}"

  publish-images:
    needs:
      - validate-tag
      - publication-preflight
      - release-approval
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.publication-preflight.result == 'success' && (needs.release-approval.result == 'success' || (needs.publication-preflight.outputs.write_mode == 'verify' && needs.release-approval.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >>"${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prebuilt Linux binaries
        if: ${{ needs.publication-preflight.outputs.ghcr_state == 'absent' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-demerzel-linux-*
          path: release
          merge-multiple: true

      - name: Set up QEMU
        if: ${{ needs.publication-preflight.outputs.ghcr_state == 'absent' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: ${{ needs.publication-preflight.outputs.ghcr_state == 'absent' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to owned GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate owned image metadata
        if: ${{ needs.publication-preflight.outputs.ghcr_state == 'absent' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ needs.validate-tag.outputs.image_exact }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish exact owned multi-platform image
        if: ${{ needs.publication-preflight.outputs.ghcr_state == 'absent' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Verify exact owned GHCR image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.image_exact }}
        run: .github/scripts/release-verify-image-revision.sh "${IMAGE}" "${GITHUB_SHA}"

  publish-github:
    needs:
      - validate-tag
      - publication-preflight
      - release-approval
      - publish-images
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.publication-preflight.result == 'success' && needs.publish-images.result == 'success' && (needs.release-approval.result == 'success' || (needs.publication-preflight.outputs.write_mode == 'verify' && needs.release-approval.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify existing GitHub draft
        if: ${{ needs.publication-preflight.outputs.github_state == 'present' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json targetCommitish,isDraft,isPrerelease)"
          test "$(jq -r '.targetCommitish' <<<"${metadata}")" = "${GITHUB_SHA}"
          test "$(jq -r '.isDraft' <<<"${metadata}")" = true
          test "$(jq -r '.isPrerelease' <<<"${metadata}")" = \
            "${{ needs.validate-tag.outputs.prerelease }}"
          mkdir existing-release
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir existing-release
          .github/scripts/release-verify-assets.sh existing-release release/SHA256SUMS

      - name: Create GitHub Release draft
        if: ${{ needs.publication-preflight.outputs.github_state == 'absent' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          preserve_order: true
          overwrite_files: false
          files: release/*
          body: |
            2.x is a rewrite and is not compatible with 1.x data. Start with an empty database and a newly provisioned master key in native vault custody or explicit age custody.


  post-publish-image-smoke:
    needs:
      - validate-tag
      - publish-images
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.publish-images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >>"${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to owned GHCR image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full runtime smoke for exact owned image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SOURCE_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.image_exact }}
          RELEASE_SMOKE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-ghcr
          RELEASE_SMOKE_SKIP_SCAN: "true"
        run: .github/scripts/release-docker-smoke.sh

  post-publish-verify:
    needs:
      - validate-tag
      - publish-github
      - publish-images
    if: ${{ !cancelled() && needs.validate-tag.result == 'success' && needs.publish-github.result == 'success' && needs.publish-images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - name: Isolate Docker credentials
        shell: bash
        run: |
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=${docker_config}" >>"${GITHUB_ENV}"

      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download trusted release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify exact GitHub Release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir draft-release
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir draft-release
          .github/scripts/release-verify-assets.sh draft-release release/SHA256SUMS
          metadata="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json targetCommitish,isDraft,isPrerelease)"
          test "$(jq -r '.targetCommitish' <<<"${metadata}")" = "${GITHUB_SHA}"
          test "$(jq -r '.isDraft' <<<"${metadata}")" = true
          test "$(jq -r '.isPrerelease' <<<"${metadata}")" = \
            "${{ needs.validate-tag.outputs.prerelease }}"

      - name: Log in to owned GHCR image for verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact owned image revision
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.image_exact }}
        run: .github/scripts/release-verify-image-revision.sh "${IMAGE}" "${GITHUB_SHA}"

  reconcile-publication:
    if: ${{ always() }}
    needs:
      - validate-tag
      - publication-preflight
      - release-approval
      - publish-images
      - publish-github
      - post-publish-image-smoke
      - post-publish-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize owned publication gate results
        env:
          PREFLIGHT_RESULT: ${{ needs.publication-preflight.result }}
          APPROVAL_RESULT: ${{ needs.release-approval.result }}
          IMAGE_WRITER_RESULT: ${{ needs.publish-images.result }}
          GITHUB_WRITER_RESULT: ${{ needs.publish-github.result }}
          IMAGE_SMOKE_RESULT: ${{ needs.post-publish-image-smoke.result }}
          VERIFY_RESULT: ${{ needs.post-publish-verify.result }}
        run: |
          {
            printf '## Demerzel publication reconciliation\n\n'
            printf -- '- preflight: `%s`\n' "${PREFLIGHT_RESULT}"
            printf -- '- protected/tag-specific approval: `%s`\n' "${APPROVAL_RESULT}"
            printf -- '- owned GHCR exact image: `%s`\n' "${IMAGE_WRITER_RESULT}"
            printf -- '- GitHub Release draft: `%s`\n' "${GITHUB_WRITER_RESULT}"
            printf -- '- owned-image runtime smoke: `%s`\n' "${IMAGE_SMOKE_RESULT}"
            printf -- '- post-publication verification: `%s`\n' "${VERIFY_RESULT}"
            printf '\nOnly the exact-version image in `ghcr.io/a-mad-av8r/demerzel` is eligible for publication. No donor registry or managed deployment is a release target.\n'
          } >>"${GITHUB_STEP_SUMMARY}"







